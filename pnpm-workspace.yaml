# pnpm 9 — the version Cloudflare's build image uses — refuses to install when
# this file exists without a packages field, which is what broke Workers Builds.
packages:
  - '.'

# wrangler bundles and runs the worker through esbuild and workerd, so both need
# their install scripts. sharp only backs wrangler's optional image handling.
# pnpm 11 reads this; pnpm 9 and 10 read pnpm.onlyBuiltDependencies in
# package.json instead, so both declarations have to stay.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
