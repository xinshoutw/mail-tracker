name: Release extension

# Tag-triggered: push v1.2.0 and the Chrome extension is packaged and attached
# to a GitHub release. extension/manifest.json must already carry the matching
# version, otherwise the build fails rather than ship a mislabelled zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the manifest version matches the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$tag" ]; then
            echo "::error file=extension/manifest.json::Tag $tag does not match manifest version $version. Bump extension/manifest.json to ${tag#v} and retag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Test
        run: node --test

      - name: Package the extension
        run: |
          cd extension
          zip -r "../mail-tracker-extension-${version}.zip" . -x '*.DS_Store'
          cd ..
          unzip -l "mail-tracker-extension-${version}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$tag" \
            --title "Mail Tracker $tag" \
            --generate-notes \
            --notes-file - \
            "mail-tracker-extension-${version}.zip" <<NOTES
          ## Install

          1. Download \`mail-tracker-extension-${version}.zip\` below and unzip it.
          2. Open \`chrome://extensions\`, turn on **Developer mode**.
          3. **Load unpacked** and select the unzipped folder.
          4. Open the extension, set your Worker URL and dashboard password.

          The Cloudflare Worker deploys separately through Workers Builds on push to \`main\`.
          NOTES
