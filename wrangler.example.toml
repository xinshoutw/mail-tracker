name = "mail-tracker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "TRACKER"
id = "your-kv-namespace-id-here"  # Replace with your actual KV namespace ID
# Run: pnpm exec wrangler kv namespace create "TRACKER"
# Then paste the id from the output here

# Required. The worker drains queued webhooks here, a short delay after each open,
# so a self-view has time to be reclassified first. Without this trigger the
# scheduled() handler never runs and Slack/Discord notifications never fire.
#
# Every minute is affordable again now that an idle firing costs one KV read
# instead of one list: the free plan allows 100,000 reads a day and only 1,000
# lists. That only holds while scheduled() keeps its QUEUE_HINT check — drop it
# and this schedule is 1,440 lists a day, over the daily limit at rest.
[triggers]
crons = ["* * * * *"]

# DASHBOARD_PASSWORD is required — the worker refuses every route without it,
# rather than leaving your recipients, subjects and opener IPs open to anyone
# who finds the URL. Set it as a secret, never as a plaintext var:
#   pnpm exec wrangler secret put DASHBOARD_PASSWORD
#
# Optional webhook notifications, also secrets:
#   pnpm exec wrangler secret put SLACK_WEBHOOK_URL
#   pnpm exec wrangler secret put DISCORD_WEBHOOK_URL
