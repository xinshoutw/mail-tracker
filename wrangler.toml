name = "email-tracker-xinshoutw"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "a4115182ce1be41e47fe040e51476a53"

[[kv_namespaces]]
binding = "TRACKER"
id = "401b91f449a84845bf61839f20078519"  # namespace title: email-tracker-xinshoutw

# Drains queued webhooks a short delay after each open, so a self-view has time
# to be reclassified first. Without this trigger the scheduled() handler never
# runs and Slack/Discord notifications never fire.
#
# Every minute is affordable again now that an idle firing costs one KV read
# instead of one list: the free plan allows 100,000 reads a day and only 1,000
# lists. That only holds while scheduled() keeps its QUEUE_HINT check — drop it
# and this schedule is 1,440 lists a day, over the daily limit at rest.
[triggers]
crons = ["* * * * *"]

# Secrets are NOT set here. They live in the Cloudflare dashboard under
# Settings -> Variables and Secrets:
#   DASHBOARD_PASSWORD   (required — the worker refuses every route without it)
#   SLACK_WEBHOOK_URL    (optional)
#   DISCORD_WEBHOOK_URL  (optional)
